name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry and build output
        uses: Swatinem/rust-cache@v2

      - name: Validate
        run: |
          cargo fmt --all --check
          cargo test --all-targets --all-features
          cargo clippy --all-targets --all-features -- -D warnings

      - name: Build release binary
        run: cargo build --release --bin websearch

      - name: Package Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/websearch dist/websearch-${{ runner.os }}-${{ runner.arch }}

      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item target/release/websearch.exe dist/websearch-Windows-${{ runner.arch }}.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: websearch-${{ runner.os }}-${{ runner.arch }}
          path: dist/*
